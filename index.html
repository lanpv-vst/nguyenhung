<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kho hàng</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2f4f7; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Nút dự phòng: khi trình duyệt chặn đăng nhập Google trong khung (lỗi 401) */
  #fallback { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
    background: #323232; color: #fff; border-radius: 20px; padding: 6px 6px 6px 14px; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); align-items: center; gap: 8px; white-space: nowrap; }
  #fallback.on { display: flex; }
  #fallback a { background: #fff; color: #1565c0; text-decoration: none; padding: 6px 12px; border-radius: 14px; font-weight: 600; }
  #fallback button { border: 0; background: none; color: #bbb; font-size: 18px; padding: 0 6px; }
</style>
</head>
<body>
<iframe id="app" title="Kho hàng" allow="clipboard-write; fullscreen"></iframe>
<div id="fallback">
  <span>Không vào được?</span>
  <a id="open" target="_top">Mở trực tiếp</a>
  <button aria-label="Ẩn" id="hide">×</button>
</div>
<script>
(function () {
  var APP = 'https://script.google.com/macros/s/AKfycbyMLMiFKpX53lpGvi47vPFjGaDWhqDRpvqwv9AtLABEOTpJ-oI0ouWSNeWV8vo9YVK8/exec';
  var url = APP + (window.location.search || '');
  // ?mo=thang → bỏ khung, chuyển thẳng (dùng khi trình duyệt luôn chặn, ví dụ lối tắt trên iPhone)
  if (/(^|[?&])mo=thang(&|$)/.test(window.location.search)) { window.location.replace(APP); return; }
  document.getElementById('open').href = url;
  document.getElementById('app').src = url;

  var fb = document.getElementById('fallback'), KEY = 'khohang_an_nut';
  var hidden = false;
  try { hidden = localStorage.getItem(KEY) === '1'; } catch (e) { }
  document.getElementById('hide').onclick = function () {
    fb.classList.remove('on');
    try { localStorage.setItem(KEY, '1'); } catch (e) { }
  };
  // Không đọc được nội dung khung khác tên miền để biết có lỗi hay không,
  // nên hiện nút dự phòng một lúc rồi tự ẩn.
  if (!hidden) {
    setTimeout(function () { fb.classList.add('on'); }, 3000);
    setTimeout(function () { fb.classList.remove('on'); }, 15000);
  }
})();
</script>
</body>
</html>
